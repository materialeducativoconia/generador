[project]
name = "generador-api"
version = "0.1.0"
description = "API y worker del generador de material educativo"
authors = [
    { name = "materialeducativoconia", email = "materialeducativoconia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.39.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pypdfium2>=5.14.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
